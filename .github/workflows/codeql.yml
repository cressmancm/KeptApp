# CodeQL, set up by hand rather than through GitHub's default setup, because
# default setup builds Swift on macos-latest. Kept needs Swift 6.4 and the
# macOS 27 SDK, which only the xcode-27 image has (a preview image as of
# 2026-10). Python has no build step and runs on Ubuntu.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: swift
            runner: xcode-27
            build-mode: manual
          - language: python
            runner: ubuntu-latest
            build-mode: none
          - language: actions
            runner: ubuntu-latest
            build-mode: none
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      # The app only: signing, the bundled Python and installing are build.sh's
      # job and CodeQL needs none of them. --disable-sandbox because SwiftPM
      # evaluates Package.swift under /usr/bin/sandbox-exec, which won't start
      # with CodeQL's build tracer injected ("Bad CPU type in executable"). The
      # runner is a throwaway machine, so the sandbox protects nothing here.
      - name: Build
        if: matrix.build-mode == 'manual'
        run: |
          swift --version
          swift build --package-path app --disable-sandbox

      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
        with:
          category: "/language:${{ matrix.language }}"
