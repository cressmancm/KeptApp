# Builds Kept and runs its tests on every push and pull request, on macOS 26,
# Kept's minimum, so a test run also checks Kept still builds and works there.
# Tests that need an installed Kept.app (the ones that run osxphotos) skip
# here, as they're written to.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Swift version
        run: swift --version

      - name: Build
        run: swift build --package-path app

      - name: Test
        run: swift test --package-path app
