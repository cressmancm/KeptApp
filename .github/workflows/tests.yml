# Builds Kept and runs its tests on every push and pull request, on macOS 26,
# Kept's minimum, so a test run also checks Kept still builds and works there.
#
# Two jobs. `test` is the quick one: swift build and swift test, where the
# tests that run osxphotos skip for want of a bundled Python. `app` builds
# Kept.app the way build.sh always does, Python and all, and runs those tests
# against the osxphotos inside it.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Toolchain
        # .xcode-version holds the oldest Xcode Kept builds with. A runner
        # image that drops below it fails here, not in a confusing compile.
        run: |
          xcodebuild -version
          swift --version
          required="$(cut -d. -f1 .xcode-version)"
          actual="$(xcodebuild -version | awk '/^Xcode/ { split($2, v, "."); print v[1] }')"
          if (( actual < required )); then
            echo "::error::Xcode $actual is older than the $required in .xcode-version"
            exit 1
          fi

      - name: Build
        run: swift build --package-path app

      - name: Test
        run: swift test --package-path app

  app:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Restore the bundled Python
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: app/.build/python-env
          # Built again when the interpreter pin or the package lock changes.
          key: python-env-${{ runner.arch }}-${{ hashFiles('app/bundle-python.sh', 'app/python-requirements.lock') }}

      - name: Build Kept.app
        # Ad-hoc: the runner has no signing identity, and this build is
        # thrown away. build.sh still checks the signature, the hardened
        # runtime and that the bundled osxphotos starts under it.
        run: KEPT_SIGN_IDENTITY=- app/build.sh --no-install

      - name: Test the built app
        # osxphotos inside it, run with Kept's real arguments, and the check
        # before every backup that the app's files match its signature.
        env:
          KEPT_TEST_APP: ${{ github.workspace }}/app/.build/Kept.app
          KEPT_TEST_PYTHON: ${{ github.workspace }}/app/.build/Kept.app/Contents/Resources/python/bin/python3
        run: swift test --package-path app --filter 'ExportArgumentsTests|AppSealTests'
